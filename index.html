<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    我的个人主页
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.8;
        }

        /* 顶部头部 */
        .header {
            background: linear-gradient(135deg, #409eff, #66b1ff);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* 主体容器 */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 卡片样式 */
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #409eff;
            margin-bottom: 15px;
            border-left: 4px solid #409eff;
            padding-left: 12px;
        }

        /* 列表 */
        ul {
            list-style: none;
        }

        li {
            padding: 8px 0;
            font-size: 16px;
        }

        /* 链接按钮 */
        .link-btn {
            display: inline-block;
            background: #409eff;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .link-btn:hover {
            background: #337ecc;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- 顶部介绍 -->
<div class="header">
    <h1>你好，我是cloudsseven</h1>
    <p>软件工程专业 | 编程爱好者 | 持续学习中</p >
</div>

<!-- 主体内容 -->
<div class="container">
    <!-- 个人简介 -->
    <div class="card">
        <h2>个人简介</h2>
        <p>本网页为软件开发</p >
    </div>

    <!-- 技能掌握 -->
    <div class="card">
        <h2>技能栈</h2>
               </ul>
    </div>

    <!-- 学习经历 -->
    <div class="card">
        <h2>学习经历</h2>
        <p>无</p >
    </div>

    <!-- 联系方式 -->
    <div class="card">
        <h2>联系方式</h2>
        <p>欢迎交流</p >
        <a class="link-btn" href=" ">我的Github</a >
    </div>
</div>

<!-- 底部版权 -->
<div class="email-footer">
    <p>📮 联系邮箱：<span id="email">2679037609@qq.com</span>
    <button onclick="copyEmail()">复制邮箱</button></p >
    <p style="margin-top:12px;font-size:14px;color:#666;">© 2026 我的个人主页 | All Rights Reserved</p >
</div>
<script>
function copyEmail(){
    const text = document.getElementById("email").innerText;
    navigator.clipboard.writeText(text);
    alert("✅ 邮箱复制成功！");
}
</script>
<style>
.email-footer{text-align:center;padding:30px 20px;margin-top:40px;}
.email-footer button{margin-left:10px;padding:4px 10px;border:none;border-radius:6px;background:#409eff;color:white;cursor:pointer;}
.email-footer button:hover{background:#337ecc;}
</style>
</body>
</html>
