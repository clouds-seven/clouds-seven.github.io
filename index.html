    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.8;
        }

        /* 顶部头部 */
        .header {
            background: linear-gradient(135deg, #409eff, #66b1ff);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* 主体容器 */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 卡片样式 */
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #409eff;
            margin-bottom: 15px;
            border-left: 4px solid #409eff;
            padding-left: 12px;
        }

        /* 列表 */
        ul {
            list-style: none;
        }

        li {
            padding: 8px 0;
            font-size: 16px;
        }

        /* 链接按钮 */
        .link-btn {
            display: inline-block;
            background: #409eff;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .link-btn:hover {
            background: #337ecc;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
